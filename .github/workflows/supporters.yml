# Updates the Supporters list in the README from the active Buy Me a Coffee memberships, once a month or by hand from
# the Actions tab. The new list arrives as a pull request on the `supporters` branch, so no name goes public without a
# review. The repository is too big to check out for one file, so the README is read and written through the API.

name: Supporters

on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: supporters

jobs:
  update:
    if: github.repository == 'by-architect/Dejavu'
    runs-on: ubuntu-latest
    steps:
      - name: Write the new list
        env:
          BMC_TOKEN: ${{ secrets.BMC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/scripts/supporters.py" \
            -o "$RUNNER_TEMP/supporters.py"
          gh api "repos/$GITHUB_REPOSITORY/contents/README.md?ref=main" --jq .content | base64 -d > "$RUNNER_TEMP/README.md"
          python3 "$RUNNER_TEMP/supporters.py" < "$RUNNER_TEMP/README.md" > "$RUNNER_TEMP/README.new.md"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if cmp -s "$RUNNER_TEMP/README.md" "$RUNNER_TEMP/README.new.md"; then
            echo "The supporters list has not changed."
            exit 0
          fi
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          # Start the branch again from main each time, so the pull request only ever holds the latest list.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/supporters" -f sha="$main" -F force=true > /dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/supporters -f sha="$main" > /dev/null
          readme=$(gh api "repos/$GITHUB_REPOSITORY/contents/README.md?ref=supporters" --jq .sha)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/README.md" -f branch=supporters -f sha="$readme" \
            -f message="Update the supporters list" -f content="$(base64 -w0 < "$RUNNER_TEMP/README.new.md")" > /dev/null
          if [ -z "$(gh pr list -R "$GITHUB_REPOSITORY" --head supporters --state open --json number --jq '.[].number')" ]; then
            gh pr create -R "$GITHUB_REPOSITORY" --base main --head supporters --title "Update the supporters list" \
              --body "The monthly update of the Supporters list in the README, from the active Buy Me a Coffee memberships. Check the names, then merge."
          fi
          echo "The new list is in the supporters pull request."
