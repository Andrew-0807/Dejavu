name: Build debug and release APK

on:
  push:
    branches: [ci/build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - name: Write mozconfig
        run: |
          cat > mozconfig <<'CFG'
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=aarch64-linux-android
          ac_add_options --enable-artifact-builds
          mk_add_options MOZ_OBJDIR=./objdir-frontend
          CFG

      - name: Bootstrap
        run: ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android Artifact Mode"

      - name: Build debug
        run: |
          ./mach build
          ./mach gradle :fenix:assembleDebug

      # The release build (R8) ran the runner out of memory after the debug build. Free the debug daemons and add swap.
      - name: Free memory for release
        run: |
          ./mach gradle --stop || true
          pkill -f KotlinCompileDaemon || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h

      - name: Build release
        run: ./mach gradle :fenix:assembleRelease

      # Release builds are debug signed by gradle (MOZ_AUTOMATION is unset), but the runner's debug key is
      # random per run. With the DEBUG_KEYSTORE_B64 secret, re-sign both APKs with the fixed key so updates install.
      - name: Re-sign with fixed key
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No DEBUG_KEYSTORE_B64, keeping runner debug signature"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          SIGNER=$(ls -d ~/.mozbuild/android-sdk-linux/build-tools/*/apksigner | sort -V | tail -1)
          for apk in objdir-frontend/gradle/build/mobile/android/fenix/app/outputs/apk/{debug,release}/*.apk; do
            "$SIGNER" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias dejavu "$apk"
            "$SIGNER" verify "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dejavu-debug-apk
          path: objdir-frontend/gradle/build/mobile/android/fenix/app/outputs/apk/debug/*arm64-v8a*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dejavu-release-apk
          path: objdir-frontend/gradle/build/mobile/android/fenix/app/outputs/apk/release/*arm64-v8a*.apk

      - name: Dejavu unit tests
        run: ./mach gradle :fenix:testDebugUnitTest --tests 'org.mozilla.fenix.dejavu.*'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dejavu-test-report
          path: objdir-frontend/gradle/build/mobile/android/fenix/app/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
