Name: Dejavu

RepoType: git
Repo: https://gitlab.com/by-architect/dejavubuild.git

Builds:
  - versionName: 2.0.1
    versionCode: 2016210001
    commit: v2.0.1
    timeout: 36000
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
      - apt-get install -y cmake make m4 pkg-config python-is-python3 python3-venv
        tcl gyp ninja-build bzip2 libffi-dev libsqlite3-dev binutils-dev clang lld
        libssl-dev zlib1g-dev nodejs terser rustup
    output: 
      ../srclib/MozFennec/obj/gradle/build/mobile/android/fenix/app/outputs/apk/release/app-*-release-unsigned.apk
    srclibs:
      - MozFennec@FIREFOX-ANDROID_159_0b1_BUILD1
      - MozAppServices@v159.0
      - MozGlean@v70.2.1
      - MozGleanAS@v70.0.0
      - wasi-sdk@wasi-sdk-20
      - llvm@3b5e7c83a6e226d5bd7ed2e9b67449b64812074c
      - llvm_android@e727bfb014bd436f581a66a450c939a6983a1fc3
      - toolchain-utils@dd1ee45a84cb07337f9d5d0a6769d9b865c6e620
    prebuild: ./prebuild.sh $$VERSION$$ $$VERCODE$$
    build: ./build.sh
    ndk:
      - 30.0.16248370
      - 29.0.14206865

MaintainerNotes: |-
  Built like Fennec F-Droid: the Repo is dejavubuild, a fork of relan's fennecbuild, and Firefox comes in as the
  MozFennec srclib at a FIREFOX-ANDROID tag. 2.0.1 uses 159.0b1 because Dejavu was already based on Firefox 159
  Nightly; builds move to FIREFOX-ANDROID_*_RELEASE tags from 159.0 (2026-10-27). prebuild.sh applies dejavu.patch
  (Dejavu's changes to that Firefox, generated from the Dejavu repository) and copies dejavu-overlay (Dejavu's
  pictures) before fennecbuild's own patches. Application Services, Glean, WASI SDK and LLVM are built from source as in Fennec.

  Dejavu builds without Google's and Adjust's libraries by itself (stand-ins in src/foss), so dejavubuild drops
  fennecbuild's gecko-liberate, a-c-liberate and fenix-liberate, and needs no microG. m-c-liberate still takes the
  Google libraries out of the version catalog. UnifiedPush and Fennec's search engine overlay are not used, so there
  is nothing to scanignore.

  Version code scheme: 2016190000 + major * 10000 + minor * 100 + patch of the Dejavu version, so 2.0.1 is
  2016210001. arm64-v8a only.

  MozAppServices, Glean versions:
  grep 'VERSION =' build/srclib/MozFennec/mobile/android/android-components/plugins/dependencies/src/main/java/ApplicationServices.kt
  grep '^glean =' build/srclib/MozFennec/gradle/libs.versions.toml

  GleanAS version:
  grep '^glean =' build/srclib/MozAppServices/gradle/libs.versions.toml

  NDK versions: the first is Firefox's (ANDROID_NDK), the second the one Glean and Application Services ask for:
  grep 'NDK_VERSION =' build/srclib/MozFennec/python/mozboot/mozboot/android.py
  grep ndkVersion build/srclib/MozGlean/build.gradle build/srclib/MozAppServices/settings.gradle

AutoUpdateMode: None
UpdateCheckMode: None
